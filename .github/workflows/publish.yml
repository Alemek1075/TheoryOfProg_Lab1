name: Release

# Runs when a release vX.Y.Z is published on GitHub: attaches the build files,
# fills empty release notes from CHANGELOG.md and publishes the package to PyPI.
on:
  release:
    types: [published]

jobs:
  files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that tag matches version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$TAG"
      - run: pip install build && python -m build
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes @vscode/vsce@3 package -o ../dist/
        working-directory: vscode
      - run: gh release upload "$TAG" dist/* --clobber
      - name: Notes from CHANGELOG.md
        if: github.event.release.body == ''
        run: |
          # section from "## X.Y.Z" to the next "## "
          awk -v v="${TAG#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release edit "$TAG" --notes-file notes.md

  pypi:
    needs: files
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing, no PyPI token is stored anywhere
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
