[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-interpreter"
version = "0.2.0"
description = "SIPL interpreter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lark"]

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff==0.17.5", "mypy==2.4.1"]

[tool.setuptools.package-data]
sipl = ["grammar/*.lark"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
